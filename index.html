<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>地形查看 · 8 km 三维地形</title>
    <style>
      :root {
        --panel: rgba(14, 20, 27, 0.78);
        --stroke: rgba(140, 175, 205, 0.18);
        --text: #dce7f2;
        --dim: #8ba2b8;
        --accent: #4ea3d8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0f14;
        color: var(--text);
        font: 13px/1.5 "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app, #app canvas { display: block; width: 100%; height: 100%; }

      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      #overlay .panel {
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 12px;
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.36);
      }

      .stats {
        padding: 12px 14px;
        min-width: 212px;
        font-variant-numeric: tabular-nums;
      }
      .stats .title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
        color: #eaf2fa;
      }
      .stats .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        font-size: 12px;
        color: var(--dim);
        padding: 1.5px 0;
      }
      .stats .row b { color: #fff; font-weight: 600; }

      .controls {
        padding: 12px;
        width: 232px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 9px;
        padding: 3px;
      }
      .seg button {
        appearance: none;
        border: 0;
        border-radius: 7px;
        padding: 7px 4px;
        font: inherit;
        font-size: 12px;
        color: var(--dim);
        background: transparent;
        cursor: pointer;
        transition: background 0.16s, color 0.16s;
      }
      .seg button:hover { color: var(--text); }
      .seg button.active {
        background: linear-gradient(180deg, #2c74a8, #235b86);
        color: #fff;
        box-shadow: 0 2px 8px rgba(46, 130, 190, 0.35);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--dim);
      }

      .gpu-name {
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--dim);
        opacity: 0.85;
        margin-top: -2px;
        word-break: break-word;
      }

      .field > span { display: flex; justify-content: space-between; }
      .field > span b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
      .field.inline {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        color: var(--text);
      }
      .field.inline span { color: var(--dim); }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid #0c1319;
        cursor: pointer;
        box-shadow: 0 0 0 1px rgba(78, 163, 216, 0.5);
      }
      input[type="range"]::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid #0c1319;
        cursor: pointer;
      }
      input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .tip {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        pointer-events: none;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(10, 15, 20, 0.62);
        border: 1px solid var(--stroke);
        color: var(--dim);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        backdrop-filter: blur(10px);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 42%, #14212c 0%, #080c11 70%);
        color: var(--text);
        z-index: 20;
        transition: opacity 0.4s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-text { font-size: 12.5px; color: var(--dim); letter-spacing: 0.04em; }

      @media (max-width: 720px) {
        #overlay { padding: 10px; flex-direction: column; }
        .controls { width: 100%; }
        .tip { font-size: 10px; padding: 6px 10px; white-space: normal; text-align: center; max-width: 92vw; }
      }
      /* 前往模型编辑器的入口按钮 */
  .editor-link {
    pointer-events: auto;
    align-self: flex-start;
    margin-top: 8px;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid rgba(120, 190, 240, 0.45);
    background: linear-gradient(180deg, rgba(44, 116, 168, 0.94), rgba(35, 91, 134, 0.94));
    color: #eaf6ff;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .editor-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }
</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div class="tip" id="tip-fallback" style="display: none"></div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">初始化…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
