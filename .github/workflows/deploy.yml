# CI：push / PR 做构建校验；push 到 master 时把 dist 发布到 GitHub Pages。
#
# 单一前端（仓库根目录）：
#   数据来源：public/data 在 .gitignore 里（二进制产物），由 resourses/ 里已跟踪的源图
#   在构建阶段用 `npm run assets` 现场生成（高度场 + 192 张卫星瓦片）。
#   本 workflow 显式校验资产与产物，缺一个即失败，避免发布一个没有地形的站点。
#
# 首次使用需要在仓库 Settings → Pages → Build and deployment → Source
# 选择 "GitHub Actions"。
name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 发布，新的 push 不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # 单一前端：只有根目录一份 lockfile
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生成地形资产
        run: npm run assets

      - name: 校验地形资产
        # assets 缺源图时是"跳过"而不是失败，这里显式把关：
        # 高度场 + 元数据 + 卫星瓦片 8×8×3 = 192 张，缺一个就不发布
        run: |
          test -f public/data/height.f16
          test -f public/data/terrain.json
          test "$(find public/data/sat -name '*.jpg' | wc -l)" -eq 192

      - name: 构建前端
        run: npm run build

      - name: 校验构建产物
        # postbuild（node scripts/ensure-assets.mjs --dist）会自动补齐 dist/data；
        # 这里再显式校验，保证发布出去的站点有地形与模型清单
        run: |
          test -f dist/index.html
          test -f dist/data/height.f16
          test -f dist/data/terrain.json
          test -f dist/data/sat/0_0_128.jpg
          test "$(find dist/data/sat -name '*.jpg' | wc -l)" -eq 192
          test -f dist/models/index.json

      - name: 配置 Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
